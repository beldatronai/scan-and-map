[project]
name = "scanmap"
version = "0.1.0"
description = "Fedora-side receiver and processing for ScanMap sessions: COLMAP + Gaussian splatting on the RTX card, alignment to ARCore poses, and 3D Wi-Fi/BLE signal fields."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scanmap = "scanmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scanmap"]
