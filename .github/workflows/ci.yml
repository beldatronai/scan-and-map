name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK and check API levels
        run: ./gradlew --no-daemon assembleLanDebug assembleOfflineDebug lintLanDebug lintOfflineDebug
      - name: Verify the offline APK has no INTERNET permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/offline/debug/app-offline-debug.apk | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then echo "offline APK requests INTERNET"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: scanmap-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk

  fedora:
    name: Fedora pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fedora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  viewer:
    name: Build viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
